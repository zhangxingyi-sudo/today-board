<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today</title><style>
:root{--bg:#fbfaf8;--fg:#1f1d1a;--mut:#8a857c;--line:#e8e4dc;--acc:#e8703a;--card:#fff;--soft:#f3efe8;--warn:#c8442b}
@media(prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#ece8e1;--mut:#8f897f;--line:#33302b;--acc:#f08a55;--card:#24221f;--soft:#2a2724;--warn:#ef7b62}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px 0;border-bottom:1px solid var(--line);z-index:2}
h1{margin:0 0 8px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1 .ttl{display:flex;align-items:baseline;gap:8px}h1 small{color:var(--mut);font-weight:400;font-size:12px}
.hdr-btn{font-size:11.5px;padding:2px 8px;color:var(--mut)}
.hdr-btn:hover{border-color:var(--acc);color:var(--acc)}
.row{display:flex;gap:6px;align-items:center}input[type=search],input[type=text],select,textarea{min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--fg);font:inherit}
input[type=search],input[type=text]{flex:1}textarea{width:100%;resize:vertical;min-height:52px}.ed input[type=text]{width:100%}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.tab{flex:none;padding:6px 9px 7px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}.tab b{font-weight:400;color:var(--mut);margin-left:3px}
main{padding:2px 14px 70px}.it{padding:9px 0;border-bottom:1px solid var(--line)}.top{display:flex;gap:9px;align-items:flex-start}
.top input[type=checkbox]{margin-top:3px;accent-color:var(--acc);width:15px;height:15px;flex:none}.tx{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.meta{color:var(--mut);font-size:11.5px;margin-top:2px}.note{margin-top:3px;font-size:12.5px;color:var(--mut);border-left:2px solid var(--line);padding-left:7px;white-space:pre-wrap}
.done .tx>span{color:var(--mut);text-decoration:line-through}.bt{flex:none;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.p{border-color:var(--acc);color:var(--acc)}button.danger{border-color:var(--warn);color:var(--warn)}
button.go{border-color:transparent;color:var(--mut);padding:3px 6px}button.go:hover{color:var(--acc)}
.empty{color:var(--mut);padding:18px 0;text-align:center}.tag{color:var(--acc)}.warn{color:var(--warn)}
.ed{margin:8px 0 2px 24px;padding:9px;background:var(--soft);border-radius:8px;display:grid;gap:7px}.ed label{font-size:11.5px;color:var(--mut)}.ed .bt{justify-content:flex-start}
h2{font-size:12px;color:var(--mut);margin:16px 0 2px;font-weight:600;letter-spacing:.04em}h2.today{color:var(--acc)}
.tm{flex:none;width:86px;font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}.tm small{display:block;color:var(--mut);font-size:11px}
select.pcat{width:auto;max-width:8.5em;margin:0 6px 0 0;padding:0 2px;border-color:transparent;border-radius:4px;background:var(--soft);color:var(--acc);font-size:11px;line-height:1.6;vertical-align:1px}
#np{flex:0 1 auto;max-width:6.8em;padding:6px 4px;font-size:12px;color:var(--mut)}
#np.on{color:var(--acc);border-color:var(--acc)}
.msg{position:fixed;left:14px;right:14px;bottom:58px;padding:8px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:12.5px;z-index:20}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:9px 14px;z-index:2}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:flex-start;justify-content:center;padding:54px 12px 16px;z-index:10}
.dlg{width:100%;max-width:380px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);overflow:hidden}
.dlg-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.dlg-bd{padding:10px 12px;overflow-y:auto;display:grid;gap:8px}
.pm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pm-row:last-child{border-bottom:0}
.pm-nm{flex:1;min-width:0;overflow-wrap:anywhere}.pm-nm small{color:var(--mut);font-size:11.5px;margin-left:5px}
.pm-cf{display:grid;gap:6px;width:100%}.pm-cf .hint{font-size:12px;color:var(--mut)}
</style></head><body><header><h1><span class="ttl">Today <small id="d"></small></span><button type="button" class="hdr-btn" onclick="openPM()">项目管理</button></h1>
<div class="row"><input id="q" type="search" placeholder="搜索全部事项…"><select id="p"></select><select id="f"></select></div><div class="tabs" id="tabs"></div></header>
<main id="m"></main><div id="modal"></div><div id="msg"></div><footer><form id="add" class="row"><select id="np" title="归属项目"></select><input id="nt" type="text" placeholder="＋ 新增一条…（“明天下午3点”会识别时间）"><button class="p">添加</button></form></footer>
<script>
const NEW_OPT="__new__";
let PROJECTS=[],items=[],tab=1,openId=null,newProj="",pmOpen=false,pmEditIdx=null,pmDelIdx=null,npTarget=null;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0"),D=new Date(),TODAY=`${D.getFullYear()}-${pad(D.getMonth()+1)}-${pad(D.getDate())}`;
const live=i=>i.status!=="已取消";
const TABS=[["日程",i=>i.time&&live(i)],["要推进",i=>i.status==="进行中"||i.status==="已推迟"],["待确认",i=>i.status==="待确认"],["已完成",i=>i.status==="已完成"],["已忽略",i=>i.status==="已取消"]];
$("#d").textContent=D.toLocaleDateString("zh-CN",{month:"long",day:"numeric"})+" 周"+"日一二三四五六"[D.getDay()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cleanProj=s=>String(s||"").replace(/[|、,，]+/g," ").replace(/\s+/g," ").trim().slice(0,40);
function say(t){$("#msg").innerHTML=`<div class="msg">${esc(t)}</div>`;setTimeout(()=>$("#msg").innerHTML="",3500)}
async function post(b){const r=await fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok)say("没有保存成功，请检查格式");await load(true)}
function syncAddProj(){
 const list=newProj&&!PROJECTS.includes(newProj)?[...PROJECTS,newProj]:PROJECTS;
 $("#np").innerHTML='<option value="">未归类</option>'+list.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("")+`<option value="${NEW_OPT}">＋ 新建…</option>`;
 $("#np").value=list.includes(newProj)?newProj:"";
 $("#np").classList.toggle("on",!!$("#np").value);
}
async function load(force){if(!force&&(openId!==null||pmOpen||npTarget!==null))return;
 const [list,names]=await Promise.all([fetch("/api/items").then(r=>r.json()),fetch("/api/projects").then(r=>r.json())]);
 items=list;if(Array.isArray(names))PROJECTS=names;
 const ds=[...new Set(items.map(i=>i.date))].sort().reverse(),cur=$("#f").value,pcur=$("#p").value;
 $("#f").innerHTML='<option value="">全部日期</option>'+ds.map(d=>`<option>${d}</option>`).join("");$("#f").value=cur;
 $("#p").innerHTML='<option value="">筛选项目</option>'+PROJECTS.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
 $("#p").value=PROJECTS.includes(pcur)?pcur:"";
 if(newProj&&!PROJECTS.includes(newProj))newProj="";
 syncAddProj();render();if(pmOpen||npTarget)renderModal()}
const setS=(id,status)=>{openId=null;post({type:"status",id,status})};
function onItemProj(id,el){
 const it=items.find(i=>i.id===id),prev=(it&&it.project)||"";
 if(el.value===NEW_OPT){el.value=prev;openNewProj({kind:"item",id});return}
 if(prev===el.value)return;
 post({type:"project",id,project:el.value});
}
function projectSelect(i,cls){
 const cur=i.project||"",list=cur&&!PROJECTS.includes(cur)?[...PROJECTS,cur]:PROJECTS;
 return `<select class="${cls}" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()" onchange="onItemProj('${i.id}',this)"><option value="">未归类</option>${list.map(p=>`<option value="${esc(p)}"${p===cur?" selected":""}>${esc(p)}</option>`).join("")}<option value="${NEW_OPT}">＋ 新建项目…</option></select>`}
function openNewProj(target){npTarget=target;renderModal();setTimeout(()=>$("#np-in")?.focus(),0)}
function closeModal(){if(npTarget){npTarget=null}else{pmOpen=false;pmEditIdx=null;pmDelIdx=null}renderModal()}
async function submitNewProj(e){
 e.preventDefault();
 const name=cleanProj($("#np-in").value);
 if(!name){say("请输入项目名称");return}
 const tgt=npTarget;npTarget=null;renderModal();
 if(tgt.kind==="item"){
  await post({type:"project",id:tgt.id,project:name});
  say(`已归类到「${name}」`);
 }else if(tgt.kind==="addbar"){
  newProj=name;
  await post({type:"project_add",name});
  newProj=name;syncAddProj();
  say(`已新建项目「${name}」`);
 }else{
  await post({type:"project_add",name});
  say(`已新建项目「${name}」`);
 }
}
function openPM(){pmOpen=true;pmEditIdx=null;pmDelIdx=null;renderModal();setTimeout(()=>$("#pm-new")?.focus(),0)}
async function pmAdd(e){
 e.preventDefault();
 const inp=$("#pm-new"),name=cleanProj(inp.value);
 if(!name){say("请输入项目名称");return}
 if(PROJECTS.includes(name)){say(`项目「${name}」已存在`);inp.select();return}
 inp.value="";
 await post({type:"project_add",name});
 say(`已新建项目「${name}」`);
 setTimeout(()=>$("#pm-new")?.focus(),0);
}
function pmStartRename(idx){pmDelIdx=null;pmEditIdx=idx;renderModal();setTimeout(()=>{const el=$("#pm-ren");if(el){el.focus();el.select()}},0)}
async function pmSaveRename(e,idx){
 e.preventDefault();
 const oldName=PROJECTS[idx],newName=cleanProj($("#pm-ren").value);
 if(!oldName||!newName){say("项目名称不能为空");return}
 if(newName===oldName){pmEditIdx=null;renderModal();return}
 const wasFilter=$("#p").value===oldName,wasAdd=newProj===oldName;
 pmEditIdx=null;
 await post({type:"project_rename",old:oldName,new:newName});
 if(wasFilter)$("#p").value=newName;
 if(wasAdd){newProj=newName;syncAddProj()}
 render();
 say(`已将「${oldName}」改为「${newName}」`);
}
function pmStartDelete(idx){pmEditIdx=null;pmDelIdx=idx;renderModal()}
async function pmConfirmDelete(idx){
 const name=PROJECTS[idx];if(!name)return;
 const wasFilter=$("#p").value===name,wasAdd=newProj===name;
 pmDelIdx=null;
 await post({type:"project_delete",name});
 if(wasFilter)$("#p").value="";
 if(wasAdd){newProj="";syncAddProj()}
 render();
 say(`已删除项目「${name}」`);
}
function renderModal(){
 const box=$("#modal");
 if(npTarget){
  const ttl=npTarget.kind==="item"?"新建项目并归类":"新建项目";
  box.innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="dlg"><div class="dlg-hd"><span>${ttl}</span><button type="button" onclick="closeModal()">×</button></div><div class="dlg-bd"><form onsubmit="submitNewProj(event)" class="row"><input id="np-in" type="text" placeholder="输入项目名称…" maxlength="40"><button class="p">确定</button></form></div></div></div>`;
  return;
 }
 if(!pmOpen){box.innerHTML="";return}
 const cntOf=p=>items.filter(i=>i.project===p).length;
 const rows=PROJECTS.length?PROJECTS.map((p,idx)=>{
  const cnt=cntOf(p);
  if(pmEditIdx===idx){
   return `<div class="pm-row"><form onsubmit="pmSaveRename(event,${idx})" class="row" style="width:100%"><input id="pm-ren" type="text" value="${esc(p)}" maxlength="40"><button class="p">保存</button><button type="button" onclick="pmEditIdx=null;renderModal()">取消</button></form></div>`;
  }
  if(pmDelIdx===idx){
   const tip=cnt?`该项目的 ${cnt} 条事项将变为「未归类」`:"当前没有关联事项";
   return `<div class="pm-row"><div class="pm-cf"><div>确定删除「<b>${esc(p)}</b>」？</div><div class="hint">${tip}</div><div class="bt" style="justify-content:flex-start"><button type="button" class="danger" onclick="pmConfirmDelete(${idx})">确定删除</button><button type="button" onclick="pmDelIdx=null;renderModal()">取消</button></div></div></div>`;
  }
  return `<div class="pm-row"><div class="pm-nm">${esc(p)}<small>${cnt?cnt+" 条":"空闲"}</small></div><div class="bt"><button type="button" onclick="pmStartRename(${idx})">改名</button><button type="button" onclick="pmStartDelete(${idx})">删除</button></div></div>`;
 }).join(""):'<div class="empty">还没有项目，在上方添加一个吧</div>';
 box.innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()"><div class="dlg"><div class="dlg-hd"><span>项目管理</span><button type="button" onclick="closeModal()">关闭</button></div><div class="dlg-bd"><form id="pm-add" onsubmit="pmAdd(event)" class="row"><input id="pm-new" type="text" placeholder="输入新项目名…" maxlength="40"><button class="p">添加</button></form><div>${rows}</div></div></div></div>`;
}
async function go(id){say("正在打开对话…");const r=await (await fetch("/api/handle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})})).json();
 say(r.ok?(r.reused?"已切到这件事的对话":"已为这件事新开一个对话"):"没有打开："+r.error)}
function ptime(s){const m=/^(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2})(?:\s*[–—\-~]\s*(\d{1,2}:\d{2}))?)?$/.exec(s||"");if(!m)return null;
 const mins=t=>t?(+t.split(":")[0])*60+(+t.split(":")[1]):null;return{day:m[1],a:m[2]||"",b:m[3]||"",s:mins(m[2]),e:mins(m[3])}}
function save(id){const it=items.find(i=>i.id===id),t=$("#et").value.trim(),n=$("#en").value.trim(),tm=$("#em").value.trim().replace(/\//g,"-");openId=null;
 const jobs=[];if(t&&t!==it.text)jobs.push({type:"edit",id,text:t});if(n!==(it.note||""))jobs.push({type:"note",id,note:n});if(tm!==(it.time||""))jobs.push({type:"time",id,time:tm});
 if(!jobs.length)return render();(async()=>{for(const j of jobs)await post(j)})()}
function editor(i){const mv=[["要推进","进行中"],["待确认","待确认"],["已完成","已完成"],["已忽略","已取消"]].filter(x=>x[1]!==i.status&&!(x[1]==="进行中"&&i.status==="已推迟"));
 return `<div class="ed"><label>内容</label><textarea id="et">${esc(i.text)}</textarea>
 <label>项目</label>${projectSelect(i,"")}
 <label>时间（有固定时间才填，例如 2026-11-13 10:00 或 2026-11-13 10:00–11:00）</label><input id="em" type="text" value="${esc(i.time||"")}" placeholder="留空表示没有固定时间">
 <label>备注</label><textarea id="en" placeholder="补充说明、进展、卡在哪…">${esc(i.note||"")}</textarea>
 <div class="bt"><button class="p" onclick="save('${i.id}')">保存</button><button onclick="openId=null;render()">取消</button></div>
 <label>移到</label><div class="bt">${mv.map(x=>`<button onclick="setS('${i.id}','${x[1]}')">${x[0]}</button>`).join("")}</div></div>`}
function row(i,k,extra){const st={"进行中":"","待确认":"待确认","已完成":"已完成","已推迟":"已推迟","已取消":"已忽略"}[i.status];
 const meta=`<div class="meta">${i.id} · ${esc(i.source)} · ${i.date}${k!==0&&i.time?` · <span class="tag">${esc(i.time.slice(5))}</span>`:''}${(k===0||i.status==="已推迟")&&st?` · <span class="tag">${st}</span>`:''}${i.local?' <span class="tag">· 待同步</span>':''}${extra||''}</div>`;
 const body=`<div class="tx" onclick="openId=openId==='${i.id}'?null:'${i.id}';render()">${projectSelect(i,"pcat")}<span>${esc(i.text)}</span>${i.note?`<div class="note">${esc(i.note)}</div>`:''}${meta}</div>`;
 let lead="",act="";const isDone=i.status==="已完成";
 if(k===1||(k===0&&(i.status==="进行中"||i.status==="已推迟")))lead=`<input type="checkbox" onchange="setS('${i.id}','已完成')">`;
 if(k===3||(k===0&&isDone))lead=`<input type="checkbox" checked onchange="setS('${i.id}','进行中')">`;
 if(i.status==="待确认")act=`<div class="bt"><button class="p" onclick="setS('${i.id}','进行中')">确认</button><button onclick="setS('${i.id}','已取消')">忽略</button></div>`;
 else if(k===4)act=`<div class="bt"><button onclick="setS('${i.id}','待确认')">找回</button></div>`;
 else if(!isDone)act=`<div class="bt"><button class="go" title="让 Claude 处理这件事" onclick="go('${i.id}')">处理 ▸</button></div>`;
 return `<div class="it ${isDone?'done':''}"><div class="top">${lead}${body}${act}</div>${openId===i.id?editor(i):''}</div>`}
function agenda(v){const f=$("#f").value,q=$("#q").value.trim(),p=$("#p").value;
 const arr=v.map(i=>({i,t:ptime(i.time)})).filter(x=>x.t&&(f||q||p||x.t.day>=TODAY)).sort((a,b)=>(a.t.day+pad(a.t.s??9999)).localeCompare(b.t.day+pad(b.t.s??9999)));
 if(!arr.length)return `<div class="empty">今天和之后没有带固定时间的事</div>`;
 const clash=new Set();for(const a of arr)for(const b of arr)if(a!==b&&a.t.day===b.t.day&&a.t.s!==null&&b.t.s!==null&&a.i.status!=="已完成"&&b.i.status!=="已完成"){
  const ae=a.t.e??a.t.s+1,be=b.t.e??b.t.s+1;if(a.t.s<be&&b.t.s<ae)clash.add(a.i.id)}
 let out="",day="";const tm=new Date(D.getTime()+864e5),TOM=`${tm.getFullYear()}-${pad(tm.getMonth()+1)}-${pad(tm.getDate())}`;
 for(const x of arr){if(x.t.day!==day){day=x.t.day;const w="日一二三四五六"[new Date(day+"T00:00").getDay()];
   out+=`<h2 class="${day===TODAY?'today':''}">${day===TODAY?'今天':day===TOM?'明天':day.slice(5).replace("-","月")+"日"} · 周${w}</h2>`}
  const t=`<div class="tm">${x.t.a||"全天"}${x.t.b?`<small>到 ${x.t.b}</small>`:''}</div>`;
  out+=row(x.i,0,clash.has(x.i.id)?' · <span class="warn">⚠ 时间冲突</span>':'').replace('<div class="top">','<div class="top">'+t)}
 return out}
function byProject(arr){const buckets=new Map();
 for(const i of arr){const k=i.project||"未归类";if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(i)}
 const keys=[...buckets.keys()].sort((a,b)=>{
  const la=buckets.get(a).every(i=>i.status==="已推迟"),lb=buckets.get(b).every(i=>i.status==="已推迟");
  if(la!==lb)return la?1:-1;
  const ia=PROJECTS.indexOf(a),ib=PROJECTS.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
 return keys.map(k=>{const rows=buckets.get(k),later=rows.every(i=>i.status==="已推迟");
  return `<h2>${esc(k)}${later?" · 排后":""}</h2>`+rows.map(i=>row(i,tab)).join("")}).join("")}
function render(){const q=$("#q").value.trim().toLowerCase(),f=$("#f").value,p=$("#p").value;
 const v=items.filter(i=>(!f||i.date===f)&&(!p||i.project===p)&&(!q||(i.text+i.id+i.source+(i.project||"")+(i.note||"")+(i.time||"")).toLowerCase().includes(q)));
 const cnt=(t,k)=>k===0?v.filter(i=>t[1](i)&&(f||q||p||(ptime(i.time)||{}).day>=TODAY)).length:v.filter(t[1]).length;
 $("#tabs").innerHTML=TABS.map((t,k)=>`<button class="tab ${k===tab?'on':''}" onclick="tab=${k};openId=null;render()">${t[0]}<b>${cnt(t,k)}</b></button>`).join("");
 if(tab===0){$("#m").innerHTML=agenda(v.filter(TABS[0][1]));return}
 const arr=v.filter(TABS[tab][1]);if(tab>=3)arr.sort((a,b)=>(b.changed||"").localeCompare(a.changed||""));
 const body=arr.length?(tab===1||tab===2?byProject(arr):arr.map(i=>row(i,tab)).join("")):`<div class="empty">${q||f||p?'没有符合条件的事项':'这里是空的'}</div>`;
 $("#m").innerHTML=body}
$("#q").oninput=render;$("#f").onchange=render;
$("#p").onchange=()=>{newProj=$("#p").value;syncAddProj();render()};
$("#np").onchange=e=>{if(e.target.value===NEW_OPT){e.target.value=newProj;openNewProj({kind:"addbar"});return}newProj=e.target.value;syncAddProj()};
$("#add").onsubmit=e=>{e.preventDefault();const t=$("#nt").value.trim();if(!t)return;$("#nt").value="";tab=1;if($("#p").value&&$("#p").value!==newProj)$("#p").value=newProj;post({type:"add",text:t,project:newProj})};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(npTarget||pmOpen)closeModal();else if(openId!==null){openId=null;render()}}});
load(true);setInterval(()=>load(false),30000);
</script></body></html>
